<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create Account</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #111; background: #fff; }
  label, .label { display: block; margin-top: 16px; font-weight: 600; }
  input, textarea { width: 100%; padding: 8px; font: inherit; box-sizing: border-box; }
  .dropdown { position: relative; }
  .dropdown > button { width: 100%; text-align: left; padding: 8px; font: inherit; background: #fff; border: 1px solid #888; }
  [role=listbox] { position: absolute; left: 0; right: 0; margin: 0; padding: 0; list-style: none; background: #fff; border: 1px solid #888; z-index: 2; }
  [role=option] { padding: 8px; cursor: pointer; }
  [role=option]:hover { background: #eef; }
  [role=switch] { margin-top: 8px; padding: 6px 14px; font: inherit; border: 1px solid #888; background: #f4f4f4; }
  [role=switch][aria-checked=true] { background: #1a7f37; color: #fff; }
  #submit { margin-top: 24px; padding: 10px 18px; font: inherit; }
  #result { margin-top: 24px; padding: 12px; border: 2px solid #0a0; display: none; }
  #error { margin-top: 24px; padding: 12px; border: 2px solid #c00; display: none; }
</style>
</head>
<body>
<h1>Create your account</h1>
<p>All fields are required. Nothing leaves this page.</p>

<div id="app"></div>

<script>
  // Behaves like a React app with controlled inputs: the form's state changes only
  // on real input events, and every render writes state back into the fields. A value
  // set directly on an element (el.value = ...) without an event is wiped on the next
  // render and never counted.
  const state = { name: '', email: '', company: '', plan: '', seats: '', annual: false, start: '', notes: '' };
  let open = false;

  const app = document.getElementById('app');
  app.innerHTML = `
    <label for="name">Full name</label><input id="name">
    <label for="email">Work email</label><input id="email" type="email">
    <label for="company">Company</label><input id="company">
    <span class="label" id="plan-label">Plan</span>
    <div class="dropdown">
      <button id="plan" type="button" aria-haspopup="listbox" aria-labelledby="plan-label plan"></button>
      <ul role="listbox" aria-labelledby="plan-label" hidden>
        <li role="option" data-v="Starter">Starter</li>
        <li role="option" data-v="Growth">Growth</li>
        <li role="option" data-v="Scale">Scale</li>
      </ul>
    </div>
    <label for="seats">Seats</label><input id="seats" type="number" min="1" max="50">
    <span class="label" id="annual-label">Annual billing</span>
    <button id="annual" type="button" role="switch" aria-labelledby="annual-label"></button>
    <label for="start">Start date (YYYY-MM-DD)</label><input id="start" placeholder="YYYY-MM-DD">
    <label for="notes">Notes</label><textarea id="notes" rows="3"></textarea>
    <button id="submit" type="button">Create account</button>
    <div id="error"></div>
    <div id="result">Account created. Confirmation code: <strong id="code"></strong></div>`;

  const fields = ['name', 'email', 'company', 'seats', 'start', 'notes'];
  const $ = id => document.getElementById(id);
  const listbox = app.querySelector('[role=listbox]');

  function render() {
    for (const f of fields) if ($(f).value !== state[f]) $(f).value = state[f];
    $('plan').textContent = state.plan || 'Choose a plan';
    listbox.hidden = !open;
    $('annual').setAttribute('aria-checked', String(state.annual));
    $('annual').textContent = state.annual ? 'On' : 'Off';
  }

  for (const f of fields) {
    $(f).addEventListener('input', e => { state[f] = e.target.value; render(); });
  }
  $('plan').addEventListener('click', () => { open = !open; render(); });
  listbox.addEventListener('click', e => {
    const opt = e.target.closest('[role=option]');
    if (!opt) return;
    state.plan = opt.dataset.v; open = false; render();
  });
  $('annual').addEventListener('click', () => { state.annual = !state.annual; render(); });

  function fnv1a(s) {
    let h = 0x811c9dc5;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
    return h.toString(16).toUpperCase().padStart(8, '0');
  }

  $('submit').addEventListener('click', () => {
    const v = {
      name: state.name.trim(),
      email: state.email.trim().toLowerCase(),
      company: state.company.trim(),
      plan: state.plan,
      seats: String(state.seats).trim(),
      annual: state.annual ? 'yes' : 'no',
      start: state.start.trim(),
      notes: state.notes.trim(),
    };
    const missing = Object.entries(v).filter(([k, x]) => k !== 'annual' && !x).map(([k]) => k);
    const err = $('error');
    if (missing.length) {
      err.textContent = 'Missing: ' + missing.join(', ');
      err.style.display = 'block';
      $('result').style.display = 'none';
      return;
    }
    err.style.display = 'none';
    $('code').textContent = fnv1a(JSON.stringify(v));
    $('result').style.display = 'block';
  });

  render();
</script>
</body>
</html>
