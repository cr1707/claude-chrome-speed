<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homeware Catalogue</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 32px auto; padding: 0 16px; color: #111; background: #fff; }
  .item { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 14px 0; border-bottom: 1px solid #e5e5e5; }
  .name { font-weight: 600; }
  .meta { color: #666; font-size: 14px; }
  .price { font-weight: 600; text-align: right; }
  #status { color: #666; margin: 16px 0; }
  #more { margin: 16px 0 48px; padding: 10px 18px; font: inherit; }
</style>
</head>
<body>
<h1>Homeware Catalogue</h1>
<p id="status">Loading…</p>
<div id="list"></div>
<button id="more" hidden>Load more</button>

<script>
  // Infinite list: 20 products per page from catalog/page-N.json, loaded on scroll
  // near the bottom or with the "Load more" button.
  let page = 0, pages = 1, total = 0, loading = false;
  const list = document.getElementById('list');
  const status = document.getElementById('status');
  const more = document.getElementById('more');

  async function loadNext() {
    if (loading || page >= pages) return;
    loading = true;
    const data = await fetch(`catalog/page-${page + 1}.json`).then(r => r.json());
    page = data.page; pages = data.pages; total = data.total;
    for (const it of data.items) {
      const row = document.createElement('div');
      row.className = 'item';
      row.innerHTML = `<span class="name"></span><span class="price"></span>
        <span class="meta"></span>`;
      row.querySelector('.name').textContent = it.name;
      row.querySelector('.price').textContent = `£${it.price.toFixed(2)}`;
      row.querySelector('.meta').textContent = `${it.category} · ★ ${it.rating.toFixed(1)}`;
      list.appendChild(row);
    }
    const shown = list.children.length;
    status.textContent = `Showing ${shown} of ${total} products`;
    more.hidden = page >= pages;
    loading = false;
  }

  more.addEventListener('click', loadNext);
  window.addEventListener('scroll', () => {
    if (innerHeight + scrollY >= document.body.scrollHeight - 300) loadNext();
  });
  loadNext();
</script>
</body>
</html>
