<svg xmlns="http://www.w3.org/2000/svg" width="880" height="288" viewBox="0 0 880 288" role="img" aria-labelledby="t d">
<title id="t">Median time per browser task, without and with the chrome-speed plugin</title>
<desc id="d">Median seconds per run, without to with the plugin. Sonnet: books 47.6 to 28.5 s, form 53.1 to 23.2 s, wiki 23.6 to 22.7 s, all runs 44.8 to 25.4 s; Opus: books 17.4 to 15.3 s, form 44.0 to 18.2 s, wiki 26.2 to 24.8 s, all runs 26.2 to 18.2 s.</desc>
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;} .num{font-variant-numeric:tabular-nums;}</style>
<rect x="0.5" y="0.5" width="879" height="287" rx="12" fill="#1a1a19" stroke="rgba(255,255,255,0.10)"/>
<text x="28" y="44" font-size="18" font-weight="600" fill="#ffffff">Median time per browser task, in seconds</text>
<rect x="576.3" y="33" width="12" height="12" rx="2" fill="#898781"/>
<text x="594.3" y="44" font-size="13" fill="#c3c2b7">Without plugin</text>
<rect x="712.4" y="33" width="12" height="12" rx="2" fill="#3987e5"/>
<text x="730.4" y="44" font-size="13" fill="#c3c2b7">With chrome-speed</text>
<text x="28" y="68" font-size="13.5" fill="#c3c2b7">48 headless Claude in Chrome runs, October 2026. Lower is better. Every run in both arms answered correctly.</text>
