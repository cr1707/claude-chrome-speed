<text x="726.0" y="44" font-size="13" fill="#52514e">With chrome-speed</text>
<text x="28" y="68" font-size="13.5" fill="#52514e">240 headless Claude in Chrome runs (10 per task, arm and model), October 2026. Lower is better. All 240 answers correct.</text>
