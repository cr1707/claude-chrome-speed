<svg xmlns="http://www.w3.org/2000/svg" width="880" height="412" viewBox="0 0 880 412" role="img" aria-labelledby="t d">
<title id="t">Median time per browser task, without and with the chrome-speed plugin</title>
<desc id="d">Median seconds per run, without to with the plugin. Sonnet 5.5, 40% less time on average per task: books 27.5 to 15.4 s (−44%, significant), form 44.5 to 18.4 s (−59%, significant), wiki 28.5 to 21.2 s (−25%, significant), spa 49.6 to 23.7 s (−52%, significant), catalog 24.8 to 21.1 s (−15%, significant), suppliers 26.7 to 20.6 s (−23%, significant); Opus 5.5, 28% less time on average per task: books 17.4 to 15.4 s (−11%, not significant), form 43.7 to 20.4 s (−53%, significant), wiki 26.1 to 21.6 s (−17%, not significant), spa 58.5 to 26.2 s (−55%, significant), catalog 30.2 to 24.1 s (−20%, not significant), suppliers 23.7 to 20.7 s (−13%, not significant). Significant means significant after Holm correction across the 12 per-task tests.</desc>
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;} .num{font-variant-numeric:tabular-nums;}</style>
